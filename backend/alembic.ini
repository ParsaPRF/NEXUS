# =====================================================================================
# Alembic configuration
# =====================================================================================
# The database URL is deliberately NOT in this file. It is read at runtime from the
# environment variable DATABASE_URL, falling back to the application settings (see
# alembic/env.py). Committing a URL here would mean committing a password.
# =====================================================================================

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Timestamped, readable revision filenames: 20261115_2100_0001_initial.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]
# Autogenerated revisions are formatted with Ruff so they match the rest of the codebase.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

# -------------------------------------------------------------------------------------
# Logging
# -------------------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
