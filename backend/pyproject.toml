[project]
name = "nexus-backend"
version = "0.1.0"
description = "NEXUS - local-first proxy management, disposable email testing and authorized registration QA platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "aiosqlite>=0.20",
    "httpx[socks]>=0.28",
    "argon2-cffi>=23.1",
    "cryptography>=44.0",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
# PostgreSQL driver is optional on purpose: see docs/DECISION_LOG.md D3 / Risk R1.
postgres = ["asyncpg>=0.30"]
# Browser-level UI testing for the Registration Lab (Phase 4+).
browser = ["playwright>=1.49"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

# ---------------------------------------------------------------------------------------
# This is an APPLICATION, not a distributable library.
#
# `package = false` tells uv not to build/install this directory as a wheel. Consequences:
#   * no build backend, no wheel metadata, no readme path resolution to get wrong
#   * `uv run` still works, because uv puts the project root on sys.path
#   * `desktop/` remains a separate consumer that cannot import `backend/app` by accident
#
# If NEXUS is ever published, add a [build-system] section and set package = true here.
# ---------------------------------------------------------------------------------------
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# The backend is not installed as a wheel (tool.uv.package = false), so the project root is
# added to sys.path explicitly. Without this, `import app` fails during collection.
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
    "e2e: requires real infrastructure (PostgreSQL, Redis, Mailpit) - skipped by default",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "PTH", "ASYNC"]
ignore = [
    "B008", # FastAPI Depends() in defaults is the documented pattern
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]

[tool.coverage.run]
source = ["app"]
omit = ["app/models/*", "alembic/*"]
